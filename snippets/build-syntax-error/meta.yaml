id: snippets/build-syntax-error
title: BUILD Syntax Error
description: >-
  Demonstrates a loading-phase syntax error in BUILD.bazel and the corrected
  declaration shape.
refs:
  - "0.1.3:Package"
  - "0.3.1:BuildFileAnatomy"
  - "0.3.5:LoadStatements"
  - "1.1.10:CommonErrors"
commands:
  - command: "bazel build //broken:demo"
    expect: error
    description: "Fails while loading the broken package because BUILD.bazel is not valid Starlark."
  - command: "bazel build //fixed:demo"
    expect: success
    description: "Succeeds with the corrected list and rule-call syntax."
bazel_version: "9.0.0"
