id: snippets/local-registry-chain
title: Local Registry Chain
description: >-
  Shows the minimal shape of a local index registry, resolves two real module
  versions, and performs an isolated dependency update that changes selected
  source bytes without inventing lockfile contents.
refs:
  - "3.1.6:BCRInfrastructure"
  - "3.1.8:RegistryStructure"
  - "3.1.9:OfflineBuilds"
  - "6.9.3:AutomatedDependencyUpdates"
commands:
  - command: "bazel mod graph --registry=file://$PWD/registry --registry=https://bcr.bazel.build"
    expect: success
    description: "Resolves the local-only registry_dep@1.0.0 with the local index registry first and the BCR URL configured as an explicit fallback."
  - command: "bazel build --registry=file://$PWD/registry --registry=https://bcr.bazel.build //app:uses_registry_dep"
    expect: success
    description: "Builds a target whose source file comes from the module resolved through the local registry."
  - command: "python3 tools/assert_registry_chain.py"
    expect: success
    description: "Asserts that mod graph sees the local-only registry_dep@1.0.0 and that its target builds with BCR configured as a fallback."
  - command: "python3 tools/assert_dependency_update.py"
    expect: success
    description: "Updates the real bazel_dep declaration from 1.0.0 to 2.0.0 in an isolated copy, resolves it, and verifies that the consumed bytes change."
bazel_version: "9.0.0"
