name: rules_glyph release

on:
  push:
    tags:
      - "v*"

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-run ruleset gate from the tag
        run: bazel test //...
      - name: Print release plan
        run: bazel run //tools/release:print_release_plan
